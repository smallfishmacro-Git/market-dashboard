name: Daily Data Update

on:
  schedule:
    # All times in UTC. Minutes are deliberately off round numbers: GitHub's
    # scheduler is most congested (and most delayed) at :00/:15/:30, so odd
    # minutes tend to fire closer to on-time.
    # NOTE: the post-close run must land AFTER 16:15 ET (the settle buffer in
    # market_time.session_is_complete) in BOTH EST and EDT, or the same-day bar
    # is correctly-but-uselessly skipped. 21:33 UTC = 16:33 ET (EST winter) /
    # 17:33 ET (EDT summer) — safely past the buffer year-round. (The user's
    # example "13 21" = 21:13 UTC = 16:13 ET in winter, 2 min too early, so it
    # is intentionally not used here.)
    - cron: "23 4 * * 1-5"    # 04:23 UTC — pre-market (refreshes prior session)
    - cron: "37 14 * * 1-5"   # 14:37 UTC — mid-session (US open settled)
    - cron: "33 21 * * 1-5"   # 21:33 UTC — post US close (persists same-day close)
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write      # needed to push updated CSVs + JSON back to repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fix SPX OHLC (yfinance fallback)
        run: python fix_spx_ohlc.py

      - name: Run data updater
        env:
          P123_API_ID: ${{ secrets.P123_API_ID }}
          P123_API_KEY: ${{ secrets.P123_API_KEY }}
        run: python data_updater.py

      - name: Compute BTD indicators JSON for Vercel app
        run: python compute_btd_json.py

      - name: Compute Market Risk JSON for Vercel app
        run: python compute_market_risk_json.py

      - name: Compute Risk Regime JSON for Vercel app
        run: python compute_risk_regime.py

      - name: Compute Equity Regime JSON for Vercel app
        env:
          P123_API_ID:  ${{ secrets.P123_API_ID }}
          P123_API_KEY: ${{ secrets.P123_API_KEY }}
          EQUITY_REGIME_OUTPUT: data/datasets/equity_regime.json
        run: python equity_regime_updater.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/barchart/*.csv data/datasets/*.csv data/datasets/*.json
          git diff --staged --quiet || git commit -m "chore: data update $(date -u +%Y-%m-%d_%H:%M)"
          git push

      # Freshness runs AFTER the commit, on purpose: it's a staleness ALARM, not
      # a publish gate. A single lagging source (e.g. Yahoo's prior-session EOD
      # arriving late) should not block committing breadth/BTD data that IS
      # fresh. The run still goes red on mismatch so the staleness is visible.
      - name: Check data freshness (alarm — red if any dataset is stale)
        if: always()
        run: python check_freshness.py
